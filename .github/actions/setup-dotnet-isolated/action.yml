name: Set up .NET (isolated) and Lakebase CLI
description: >
  Installs the global.json SDK into a per-job, per-arch directory under RUNNER_TEMP so
  self-hosted runners never reuse a host or previous-job SDK, then optionally restores
  (locked) and builds the Lakebase CLI once. Later steps call `dotnet "$LAKEBASE_CLI" ...`.
  Callers must check out trusted code before using this action in privileged jobs.

inputs:
  build-cli:
    description: Restore (locked) and build src/Lakebase.Cli, exporting LAKEBASE_CLI
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Isolate .NET from host install
      shell: bash
      run: |
        set -euo pipefail
        arch="$(uname -m)"
        install_dir="$RUNNER_TEMP/dotnet-$arch"
        for candidate in "$install_dir" "$RUNNER_TEMP/dotnet"; do
          if [ -x "$candidate/dotnet" ]; then
            existing="$(file -b "$candidate/dotnet" || true)"
            case "$existing" in
              *"$arch"*) ;;
              *) rm -rf "$candidate" ;;
            esac
          fi
        done
        mkdir -p "$install_dir"
        {
          echo "DOTNET_INSTALL_DIR=$install_dir"
          echo "DOTNET_ROOT=$install_dir"
          echo "DOTNET_MULTILEVEL_LOOKUP=0"
          echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget"
        } >> "$GITHUB_ENV"
        echo "$install_dir" >> "$GITHUB_PATH"

    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Build Lakebase CLI (locked restore)
      if: inputs.build-cli == 'true'
      shell: bash
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/lakebase-cli"
        dotnet restore src/Lakebase.Cli --locked-mode
        dotnet build src/Lakebase.Cli --configuration Release --no-restore --output "$out" \
          -nodeReuse:false -p:UseSharedCompilation=false
        echo "LAKEBASE_CLI=$out/Lakebase.Cli.dll" >> "$GITHUB_ENV"
