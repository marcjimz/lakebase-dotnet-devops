version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      efcore-npgsql:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql*"
      xunit:
        patterns:
          - "xunit*"
