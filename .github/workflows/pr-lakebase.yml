name: Lakebase PR Schema
on:
  pull_request_target:
    branches: [develop]
    types: [opened, reopened, synchronize, closed]

# Trusted lane: GitHub loads this workflow from the default branch.
# Never execute PR application code here. The only PR-controlled inputs applied
# are Flyway SQL and a strictly validated flyway.conf, on an isolated pr-N branch.
permissions: {}

concurrency:
  group: lakebase-pr-schema-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CI_BRANCH_NAME: pr-${{ github.event.pull_request.number }}
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  MSBUILDDISABLENODEREUSE: "1"

jobs:
  detect:
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: detect-schema
    runs-on: ${{ vars.LAKEBASE_TRUSTED_RUNNER || 'self-hosted' }}
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      schema_changed: ${{ steps.detect.outputs.schema_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Detect Flyway schema changes with trusted code
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/detect-schema-changes.sh

  provision:
    needs: detect
    if: needs.detect.outputs.schema_changed == 'true'
    runs-on: ${{ vars.LAKEBASE_TRUSTED_RUNNER || 'self-hosted' }}
    environment: dev-platform
    permissions:
      contents: read
    timeout-minutes: 20
    concurrency:
      group: lakebase-dev-platform
      cancel-in-progress: false
    outputs:
      host: ${{ steps.branch.outputs.host }}
      endpoint_id: ${{ steps.branch.outputs.endpoint_id }}
      branch_name: ${{ steps.branch.outputs.branch_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up .NET and build trusted Lakebase CLI
        uses: ./.github/actions/setup-dotnet-isolated
        with:
          build-cli: "true"
      - name: Recreate isolated PR branch
        id: branch
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          LAKEBASE_PLATFORM_CLIENT_ID: ${{ secrets.LAKEBASE_PLATFORM_CLIENT_ID }}
          LAKEBASE_PLATFORM_CLIENT_SECRET: ${{ secrets.LAKEBASE_PLATFORM_CLIENT_SECRET }}
          LAKEBASE_PROJECT_ID: ${{ secrets.LAKEBASE_PROJECT_ID }}
          LAKEBASE_MAIN_BRANCH_ID: ${{ secrets.LAKEBASE_PARENT_BRANCH_ID }}
          LAKEBASE_DEV_GROUP: ${{ secrets.LAKEBASE_DEV_GROUP }}
          LAKEBASE_APP_SP_ID: ${{ secrets.LAKEBASE_APP_SP_ID }}
          LAKEBASE_ALLOW_BRANCH_DELETE: "true"
        run: |
          set -euo pipefail
          dotnet "$LAKEBASE_CLI" \
            lakebase platform branch create "$CI_BRANCH_NAME" \
              --ttl-hours 24 --recreate --no-write-env
      - name: Stop MSBuild servers
        if: always()
        run: dotnet build-server shutdown || true

  migrate-schema:
    needs: [detect, provision]
    if: >
      needs.detect.outputs.schema_changed == 'true' &&
      needs.provision.result == 'success'
    runs-on: ${{ vars.LAKEBASE_TRUSTED_RUNNER || 'self-hosted' }}
    environment: dev-database
    permissions:
      contents: read
    timeout-minutes: 30
    concurrency:
      group: lakebase-dev-database-pr
      cancel-in-progress: false
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up .NET and build trusted CLI before reading PR files
        uses: ./.github/actions/setup-dotnet-isolated
        with:
          build-cli: "true"
      - name: Checkout PR schema files only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .pr-schema
          sparse-checkout: |
            db/migrations
            conf/flyway.conf
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Stage and validate PR schema with trusted CLI
        run: |
          set -euo pipefail
          if find .pr-schema/db/migrations .pr-schema/conf -type l -print -quit | grep -q .; then
            echo "::error::Symlinks are not allowed in PR schema inputs"
            exit 1
          fi
          rm -rf db/migrations
          mkdir -p db/migrations conf
          cp -R .pr-schema/db/migrations/. db/migrations/
          cp .pr-schema/conf/flyway.conf conf/flyway.conf
          dotnet "$LAKEBASE_CLI" lakebase db lint
      - name: Mint table-owner credential
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          CLIENT_ID: ${{ secrets.LAKEBASE_DATABASE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.LAKEBASE_DATABASE_CLIENT_SECRET }}
          DB_USERNAME: ${{ secrets.LAKEBASE_DATABASE_USERNAME }}
          DB_HOST: ${{ needs.provision.outputs.host }}
          LAKEBASE_PROJECT_ID: ${{ vars.LAKEBASE_PROJECT_ID }}
          DB_BRANCH: ${{ needs.provision.outputs.branch_name }}
          DB_ENDPOINT_ID: ${{ needs.provision.outputs.endpoint_id }}
        run: bash .github/scripts/mint-lakebase-credential.sh
      - name: Transfer application DDL ownership to app SP
        env:
          LAKEBASE_APP_SP_ID: ${{ vars.LAKEBASE_APP_SP_ID }}
          LAKEBASE_APP_SP_ID_SECRET: ${{ secrets.LAKEBASE_APP_SP_ID }}
          LAKEBASE_DATABASE_CLIENT_ID: ${{ secrets.LAKEBASE_DATABASE_CLIENT_ID }}
        run: |
          set -euo pipefail
          app="${LAKEBASE_APP_SP_ID:-${LAKEBASE_APP_SP_ID_SECRET:-${LAKEBASE_DATABASE_CLIENT_ID:-}}}"
          [ -n "$app" ] || { echo "::error::Set LAKEBASE_APP_SP_ID or LAKEBASE_DATABASE_CLIENT_ID in dev-database"; exit 1; }
          dotnet "$LAKEBASE_CLI" lakebase db grant-ddl --to "$app"
      - name: Mint app SP credential for migrate
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          CLIENT_ID: ${{ secrets.LAKEBASE_DATABASE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.LAKEBASE_DATABASE_CLIENT_SECRET }}
          DB_USERNAME: ${{ secrets.LAKEBASE_APP_SP_ID }}
          DB_USERNAME_FALLBACK: ${{ secrets.LAKEBASE_DATABASE_USERNAME }}
          DATABASE_CLIENT_ID: ${{ secrets.LAKEBASE_DATABASE_CLIENT_ID }}
          DB_HOST: ${{ needs.provision.outputs.host }}
          LAKEBASE_PROJECT_ID: ${{ vars.LAKEBASE_PROJECT_ID }}
          DB_BRANCH: ${{ needs.provision.outputs.branch_name }}
          DB_ENDPOINT_ID: ${{ needs.provision.outputs.endpoint_id }}
          APP_SP_VAR: ${{ vars.LAKEBASE_APP_SP_ID }}
        run: |
          set -euo pipefail
          export DB_USERNAME="${APP_SP_VAR:-${DB_USERNAME:-${DATABASE_CLIENT_ID:-$DB_USERNAME_FALLBACK}}}"
          [ -n "$DB_USERNAME" ] || { echo "::error::App SP / database username is empty"; exit 1; }
          bash .github/scripts/mint-lakebase-credential.sh
      - name: Apply and validate Flyway SQL
        run: |
          set -euo pipefail
          dotnet "$LAKEBASE_CLI" lakebase db setup
          dotnet "$LAKEBASE_CLI" lakebase db migrate
          dotnet "$LAKEBASE_CLI" lakebase db validate
          mkdir -p artifacts
          dotnet "$LAKEBASE_CLI" lakebase db info | tee artifacts/flyway-info.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: flyway-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/flyway-info.txt
          retention-days: 30
      - name: Stop MSBuild servers
        if: always()
        run: dotnet build-server shutdown || true

  lakebase-schema:
    name: lakebase-schema
    needs: [detect, provision, migrate-schema]
    if: always() && github.event.action != 'closed'
    runs-on: ${{ vars.LAKEBASE_TRUSTED_RUNNER || 'self-hosted' }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Report trusted schema gate
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          SCHEMA_CHANGED: ${{ needs.detect.outputs.schema_changed }}
          PROVISION_RESULT: ${{ needs.provision.result }}
          MIGRATE_RESULT: ${{ needs.migrate-schema.result }}
        run: |
          set -euo pipefail
          [ "$DETECT_RESULT" = "success" ] || { echo "::error::Schema detection failed"; exit 1; }
          if [ "$SCHEMA_CHANGED" = "true" ]; then
            [ "$PROVISION_RESULT" = "success" ] || { echo "::error::PR branch provisioning failed"; exit 1; }
            [ "$MIGRATE_RESULT" = "success" ] || { echo "::error::PR schema migration failed"; exit 1; }
          fi
          echo "Trusted Lakebase schema gate passed (schema_changed=${SCHEMA_CHANGED:-unknown})"

  cleanup:
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.LAKEBASE_TRUSTED_RUNNER || 'self-hosted' }}
    environment: dev-platform
    permissions:
      contents: read
    timeout-minutes: 15
    concurrency:
      group: lakebase-dev-platform
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up .NET and build trusted Lakebase CLI
        uses: ./.github/actions/setup-dotnet-isolated
        with:
          build-cli: "true"
      - name: Delete isolated PR branch
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          LAKEBASE_PLATFORM_CLIENT_ID: ${{ secrets.LAKEBASE_PLATFORM_CLIENT_ID }}
          LAKEBASE_PLATFORM_CLIENT_SECRET: ${{ secrets.LAKEBASE_PLATFORM_CLIENT_SECRET }}
          LAKEBASE_PROJECT_ID: ${{ secrets.LAKEBASE_PROJECT_ID }}
          LAKEBASE_MAIN_BRANCH_ID: ${{ secrets.LAKEBASE_PARENT_BRANCH_ID }}
          LAKEBASE_APP_SP_ID: ${{ secrets.LAKEBASE_APP_SP_ID }}
          LAKEBASE_ALLOW_BRANCH_DELETE: "true"
        run: |
          set -euo pipefail
          dotnet "$LAKEBASE_CLI" \
            lakebase platform branch delete "$CI_BRANCH_NAME" --ignore-missing
      - name: Stop MSBuild servers
        if: always()
        run: dotnet build-server shutdown || true
