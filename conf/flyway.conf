# Non-secret Flyway settings. JDBC URL, user, and password are set by
# `lakebase db` from DATABASE_URL (never store them here).
flyway.locations=filesystem:db/migrations
flyway.table=flyway_schema_history
flyway.defaultSchema=public
flyway.schemas=public
flyway.validateMigrationNaming=true
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql
# Lakebase installs helper functions in public, so Flyway sees a non-empty schema; baselineVersion=0 still applies V1. No-op once flyway_schema_history exists. Truly empty DBs skip baseline and run V1.
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
